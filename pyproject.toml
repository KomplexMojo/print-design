[project]
name = "printloop"
version = "0.1.0"
description = "Ideate, design, slice, print and refine 3D-printed parts with build123d and a Bambu H2S"
requires-python = ">=3.11"
dependencies = [
    "build123d>=0.10,<0.14",
    "trimesh>=4",
    "rtree",
    "numpy",
    "matplotlib",
    "pyyaml",
]

[project.scripts]
printloop = "printloop.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["printloop"]
